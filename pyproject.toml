[project]
name = "skillabel"
version = "0.3.0"
description = "Nutrition labels, audit surface, and report cards for AI agent skills"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "pydantic>=2.7",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "httpx>=0.27",
    "anthropic>=0.50",
]

[project.scripts]
skillabel = "skillabel.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["skillabel"]

[tool.uv]
# Do not take a release younger than 7 days: most poisoned releases are found
# and pulled within hours or days. Needs uv 0.9 or newer (set with uv 0.13.5).
# To take a fix for a security hole sooner, let that one package through for
# one lock, for example:
#   uv lock --upgrade-package NAME --exclude-newer-package NAME=2026-11-23T00:00:00Z
exclude-newer = "7 days"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
